paths:
  /admin/employees:
    get:
      summary: Listar funcionários
      tags:
        - Admin - Employees
      security:
        - sanctum: []
      responses:
        "200":
          description: OK

    post:
      summary: Criar novo funcionário
      tags:
        - Admin - Employees
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
                role: { type: string }
      responses:
        "201":
          description: Funcionário criado

  /admin/employees/{id}:
    get:
      summary: Ver funcionário
      tags:
        - Admin - Employees
      security:
        - sanctum: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
