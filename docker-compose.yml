services:
  app:
    image: 511758682326.dkr.ecr.us-east-1.amazonaws.com/ponto-saas-api:latest
    container_name: laravel-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_STACK: daily,stderr


      RUN_COMPOSER_INSTALL: "false"
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "false"
      WAIT_FOR_DB: "false"
    networks:
      - laravel
    volumes:
      - public_data:/var/www/public

  queue-worker:
    image: 511758682326.dkr.ecr.us-east-1.amazonaws.com/ponto-saas-api:latest
    container_name: laravel-queue
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr

      RUN_COMPOSER_INSTALL: "false"
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "false"
      WAIT_FOR_DB: "false"
    depends_on:
      - app
    command: ["php", "/var/www/artisan", "queue:work", "database", "--queue=default", "--sleep=1", "--tries=3", "--timeout=120"]
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - laravel
    volumes:
      - ./.docker/nginx:/etc/nginx/conf.d:ro
      - public_data:/var/www/public:ro

networks:
  laravel:
    driver: bridge

volumes:
  public_data: {}
