services:
  app:
    build:
      context: .
      dockerfile: ./.docker/php/Dockerfile
    image: jornafy-api:latest
    container_name: laravel-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      # controla comportamento do entrypoint
      RUN_COMPOSER_INSTALL: "false"
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "true"
      WAIT_FOR_DB: "true"
    env_file:
      - .env
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./.docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
