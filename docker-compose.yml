services:
  app:
    image: 511758682326.dkr.ecr.us-east-1.amazonaws.com/ponto-saas-api:latest
    container_name: laravel-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_STACK: daily,stderr


      RUN_COMPOSER_INSTALL: "false"
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "false"
      WAIT_FOR_DB: "false"
    networks:
      - laravel
    volumes:
      - public_data:/var/www/public
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: ${AWSLOGS_GROUP:-/docker/ponto-saas-api}
        awslogs-stream: laravel-app
        awslogs-create-group: "true"

  queue-worker:
    image: 511758682326.dkr.ecr.us-east-1.amazonaws.com/ponto-saas-api:latest
    container_name: laravel-queue
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr

      RUN_COMPOSER_INSTALL: "false"
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "false"
      WAIT_FOR_DB: "false"
    depends_on:
      - app
    command: ["php", "/var/www/artisan", "queue:work", "database", "--queue=default", "--sleep=1", "--tries=3", "--timeout=120"]
    networks:
      - laravel
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: ${AWSLOGS_GROUP:-/docker/ponto-saas-api}
        awslogs-stream: laravel-queue
        awslogs-create-group: "true"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - laravel
    volumes:
      - ./.docker/nginx:/etc/nginx/conf.d:ro
      - public_data:/var/www/public:ro
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: ${AWSLOGS_GROUP:-/docker/ponto-saas-api}
        awslogs-stream: nginx
        awslogs-create-group: "true"

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: jornafy_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      TZ: America/Sao_Paulo
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-encryption-key-change-me}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  public_data: {}
  n8n_data: {}
