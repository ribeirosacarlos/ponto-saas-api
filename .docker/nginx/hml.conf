include /etc/nginx/cloudflare-real-ip.conf;

server {
  listen 80;
  server_name hml-api.jornafy.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/public;
    auth_basic off;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name hml-api.jornafy.com;

  ssl_certificate     /etc/nginx/certs/hml-api.pem;
  ssl_certificate_key /etc/nginx/certs/hml-api.key;

  root /var/www/public;
  index index.php;

  access_log /dev/stdout;
  error_log /dev/stderr;

  client_max_body_size 100M;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "0" always;

  auth_basic "Jornafy HML";
  auth_basic_user_file /etc/nginx/auth/hml.htpasswd;

  location = /health {
    auth_basic off;
    try_files $uri /index.php?$query_string;
  }

  location = /up {
    auth_basic off;
    try_files $uri /index.php?$query_string;
  }

  location = /api/v1/billing/stripe/webhook {
    auth_basic off;
    try_files $uri /index.php?$query_string;
  }

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;

    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_X_FORWARDED_PROTO https;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    fastcgi_param HTTP_X_FORWARDED_PORT 443;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
    fastcgi_param REMOTE_ADDR $remote_addr;

    fastcgi_pass app:9000;
    fastcgi_read_timeout 120;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }

  location ~* /(composer\.(json|lock)|package(-lock)?\.json|artisan|phpunit\.xml|vite\.config\.js)$ {
    deny all;
  }
}
