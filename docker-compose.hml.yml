services:
  app:
    image: jornafy-api:hml
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-hml}
    container_name: jornafy-hml-app
    env_file: !override
      - path: .env.hml
        required: false
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_STACK: daily,stderr
      RUN_COMPOSER_INSTALL: "false"
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "false"
      WAIT_FOR_DB: "true"
    depends_on:
      hml-db:
        condition: service_healthy
    volumes: !override
      - public_data:/var/www/public
      - hml_storage:/var/www/storage
    logging: !override
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  queue-worker:
    image: jornafy-api:hml
    container_name: jornafy-hml-queue
    env_file: !override
      - path: .env.hml
        required: false
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      RUN_COMPOSER_INSTALL: "false"
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "false"
      WAIT_FOR_DB: "true"
    depends_on: !override
      app:
        condition: service_started
      hml-db:
        condition: service_healthy
    command: ["php", "/var/www/artisan", "queue:work", "database", "--queue=default,commercial-email", "--sleep=1", "--tries=3", "--timeout=120"]
    volumes: !override
      - public_data:/var/www/public
      - hml_storage:/var/www/storage
    logging: !override
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  scheduler:
    image: jornafy-api:hml
    container_name: jornafy-hml-scheduler
    restart: unless-stopped
    profiles:
      - scheduler
    env_file:
      - path: .env.hml
        required: false
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      RUN_COMPOSER_INSTALL: "false"
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "false"
      WAIT_FOR_DB: "true"
    depends_on:
      app:
        condition: service_started
      hml-db:
        condition: service_healthy
    command: ["sh", "-c", "while true; do php /var/www/artisan schedule:run --no-interaction; sleep 60; done"]
    networks:
      - laravel
    volumes:
      - public_data:/var/www/public
      - hml_storage:/var/www/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    container_name: jornafy-hml-nginx
    ports: !override
      - "80:80"
      - "443:443"
    depends_on: !override
      app:
        condition: service_started
    volumes: !override
      - ./.docker/nginx/hml.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.docker/nginx/cloudflare-real-ip.conf:/etc/nginx/cloudflare-real-ip.conf:ro
      - ./.docker/nginx/hml.htpasswd:/etc/nginx/auth/hml.htpasswd:ro
      - ./.docker/nginx/certs:/etc/nginx/certs:ro
      - public_data:/var/www/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: !override
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  hml-db:
    image: postgres:16-alpine
    container_name: jornafy-hml-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jornafy_hml}
      POSTGRES_USER: ${DB_USERNAME:-jornafy_hml}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-create-env-hml}
    volumes:
      - hml_postgres_data:/var/lib/postgresql/data
    networks:
      - laravel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  n8n:
    container_name: jornafy-hml-n8n
    profiles:
      - n8n
    ports: !override
      - "127.0.0.1:5678:5678"
    environment: !override
      TZ: America/Sao_Paulo
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_HOST: ${N8N_HML_HOST:-hml-n8n.jornafy.com}
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${N8N_HML_WEBHOOK_URL:-https://hml-n8n.jornafy.com/}
      N8N_EDITOR_BASE_URL: ${N8N_HML_WEBHOOK_URL:-https://hml-n8n.jornafy.com/}
      N8N_PROXY_HOPS: 1
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-use-env-hml}
    logging: !override
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  hml_storage: {}
  hml_postgres_data: {}
