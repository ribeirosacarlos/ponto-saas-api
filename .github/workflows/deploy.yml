name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extension-csv: mbstring, intl, bcmath

      - name: Install Composer dependencies
        run: |
          composer install --no-dev --optimize-autoloader

      - name: Prepare build folder
        run: |
          mkdir build
          cp -R * build/
          cp -R vendor build/vendor

      - name: Upload Laravel root to Hostinger (except public)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          local-dir: build
          server-dir: laravel-api

      - name: Upload Public folder to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          local-dir: build/public
          server-dir: public_html
