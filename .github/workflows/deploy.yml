name: Deploy API (ECR -> EC2)

on:
    push:
        branches: ["main"]
    workflow_dispatch: {}

concurrency:
    group: deploy-main
    cancel-in-progress: true

jobs:
    build-push-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Wait for deploy window
              env:
                  DEPLOY_TIMEZONE: America/Sao_Paulo
                  DEPLOY_MORNING_END_TIME: "09:00"
                  DEPLOY_NIGHT_START_TIME: "20:00"
              run: |
                  current_time=$(TZ="$DEPLOY_TIMEZONE" date +%H:%M)

                  if [ "$current_time" \< "$DEPLOY_MORNING_END_TIME" ] || [ "$current_time" = "$DEPLOY_MORNING_END_TIME" ] || [ "$current_time" \> "$DEPLOY_NIGHT_START_TIME" ] || [ "$current_time" = "$DEPLOY_NIGHT_START_TIME" ]; then
                    echo "Janela de deploy liberada às ${current_time} (${DEPLOY_TIMEZONE})."
                    exit 0
                  fi

                  now_ts=$(TZ="$DEPLOY_TIMEZONE" date +%s)
                  today=$(TZ="$DEPLOY_TIMEZONE" date +%F)
                  start_ts=$(TZ="$DEPLOY_TIMEZONE" date -d "$today $DEPLOY_NIGHT_START_TIME" +%s)
                  wait_seconds=$((start_ts - now_ts))

                  echo "Deploy bloqueado entre ${DEPLOY_MORNING_END_TIME} e ${DEPLOY_NIGHT_START_TIME} (${DEPLOY_TIMEZONE}). Aguardando ${wait_seconds}s."
                  sleep "$wait_seconds"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            -   name: Login to Amazon ECR
                id: ecr-login
                uses: aws-actions/amazon-ecr-login@v2

            -   name: Build and push image to ECR
                env:
                    AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                    AWS_REGION: ${{ secrets.AWS_REGION }}
                    ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
                    IMAGE_TAG: ${{ github.sha }}
                run: |
                    ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
                    IMAGE="${ECR_URI}/${ECR_REPOSITORY}:${IMAGE_TAG}"
                    IMAGE_LATEST="${ECR_URI}/${ECR_REPOSITORY}:latest"

                    docker build \
                      --pull \
                      --no-cache \
                      --build-arg APP_BUILD_SHA="${IMAGE_TAG}" \
                      -f ./.docker/php/Dockerfile \
                      -t "$IMAGE" \
                      -t "$IMAGE_LATEST" \
                      .

                    docker push "$IMAGE"
                    docker push "$IMAGE_LATEST"


            - name: Deploy on EC2 via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      set -e
                      cd /opt/jornafy-api

                      # Login no ECR
                      aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
                        docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

                      # Pull imagem
                      docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

                      # Sobe containers
                      docker compose -f docker-compose.prod.yml up -d --pull always --force-recreate

                      # Aguarda container iniciar
                      sleep 10

                      # Rodar migrations
                      docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

                      # Limpar imagens antigas
                      docker image prune -f
